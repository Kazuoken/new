version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - db-data:/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - AllowedOrigins=http://localhost:5173
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/url/manage"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
